<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuJoCo Drone Designer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-base: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .panel {
            width: 320px;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .canvas-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            cursor: crosshair;
            display: block;
        }

        h1, h2, h3 {
            margin-top: 0;
            font-weight: 600;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }
        
        h2 {
            font-size: 1rem;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="number"], input[type="text"], select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 10px;
        }
        
        .row > * {
            flex: 1;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button.danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        
        button.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .motor-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .motor-item {
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .motor-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .motor-item.selected {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Left Panel: Global Settings -->
    <div class="panel">
        <h1>Global Settings</h1>
        
        <div class="form-group">
            <label>Drone Name</label>
            <input type="text" id="g_name" value="custom_drone">
        </div>
        
        <div class="form-group">
            <label>Core Mass (kg)</label>
            <input type="number" id="g_mass" value="0.5" step="0.05">
        </div>

        <div class="form-group">
            <label>Core Dimensions (X, Y, Z mm)</label>
            <div class="row">
                <input type="number" id="g_size_x" value="60" step="1">
                <input type="number" id="g_size_y" value="40" step="1">
                <input type="number" id="g_size_z" value="20" step="1">
            </div>
        </div>
        
        <div class="form-group">
            <label>Center of Mass Override (X, Y, Z mm)</label>
            <div class="row">
                <input type="number" id="g_com_x" value="0" step="1">
                <input type="number" id="g_com_y" value="0" step="1">
                <input type="number" id="g_com_z" value="0" step="1">
            </div>
            <label style="font-size: 0.7rem; margin-top: 4px;">Leave at 0,0,0 to let MuJoCo auto-compute, or override it to force an unbalanced drone.</label>
        </div>

        <div class="form-group">
            <label>DOF Mask (X Y Z Roll Pitch Yaw)</label>
            <input type="text" id="g_dof" value="0 0 1 1 1 1">
        </div>

        <div class="form-group">
            <label>Transport Delay (ms)</label>
            <input type="number" id="g_delay" value="10.0" step="1.0">
        </div>
        
        <div class="form-group">
            <label>Motor Time Constant &tau; (s)</label>
            <input type="number" id="g_tau" value="0.015" step="0.001">
        </div>
        
        <div class="form-group">
            <label>Simulation Flight Time (s)</label>
            <input type="number" id="g_sim_time" value="5.0" step="1.0">
            <label style="font-size: 0.7rem; margin-top: 4px;">Larger drones need more time (e.g. 10s) to stabilize during optimization.</label>
        </div>
        
        <div class="form-group">
            <label>SDF / PX4 Sensors</label>
            <div style="display: flex; gap: 10px; font-size: 0.9rem;">
                <label><input type="checkbox" id="g_sensor_imu" checked> IMU</label>
                <label><input type="checkbox" id="g_sensor_baro" checked> Barometer</label>
                <label><input type="checkbox" id="g_sensor_mag" checked> Compass (Mag)</label>
                <label><input type="checkbox" id="g_sensor_gps" checked> GPS</label>
            </div>
        </div>

        <button onclick="exportSDF()" style="margin-top: auto; padding: 14px; font-size: 1rem;">Export SDF</button>
    </div>

    <!-- Center: Canvas -->
    <div class="canvas-container" id="canvas-container">
        <canvas id="designer"></canvas>
    </div>

    <!-- Right Panel: Motor Settings -->
    <div class="panel">
        <h1>Motor Editor</h1>
        <button onclick="addMotor()">+ Add Motor</button>
        
        <div id="motor-settings" style="display: none; margin-top: 20px;">
            <h2>Selected Motor</h2>
            
            <div class="form-group">
                <label>Position (X, Y, Z mm) [Drag on canvas]</label>
                <div class="row">
                    <input type="number" id="m_x" step="1" onchange="updateMotor()">
                    <input type="number" id="m_y" step="1" onchange="updateMotor()">
                    <input type="number" id="m_z" step="1" onchange="updateMotor()" value="0">
                </div>
            </div>
            
            <div class="form-group">
                <label>Prop Size (inches)</label>
                <input type="number" id="m_prop" value="5" step="0.5" onchange="updateMotor()">
            </div>
            
            <div class="form-group">
                <label>Max Force Override (N)</label>
                <input type="number" id="m_force" value="12" step="0.5" onchange="updateMotor()">
            </div>
            
            <div class="form-group" style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                <label>Performance Data (RPM, Thrust, Torque)</label>
                <div class="row" style="margin-bottom: 8px;">
                    <select id="m_thrust_unit" onchange="updateMotor()">
                        <option value="gf">Grams-force (gf)</option>
                        <option value="kgf">Kg-force (kgf)</option>
                        <option value="N">Newtons (N)</option>
                    </select>
                    <select id="m_torque_unit" onchange="updateMotor()">
                        <option value="Nm">Nm</option>
                        <option value="Ncm">Ncm</option>
                    </select>
                </div>
                <textarea id="m_perf_data" rows="6" placeholder="Format (space or comma separated):&#10;RPM Thrust Torque&#10;3400 13.27 0.01&#10;3800 16.72 0.015" onchange="updateMotor()" style="width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 4px; font-family: monospace; resize: vertical;"></textarea>
                <button onclick="autoCalcFromData()" style="margin-top: 8px; font-size: 0.8rem; padding: 6px;">Auto-Calc Max Force & Drag</button>
            </div>
            
            <div class="form-group">
                <label>Yaw Drag Torque</label>
                <input type="number" id="m_drag" value="0.015" step="0.001" onchange="updateMotor()">
            </div>
            
            <div class="form-group">
                <label>Prop Mass (g)</label>
                <input type="number" id="m_prop_mass" value="3" step="0.1" onchange="updateMotor()">
                <label style="font-size: 0.7rem; margin-top: 4px;">Used for accurate rotational inertia calculation.</label>
            </div>

            <div class="form-group">
                <label>Spin Direction</label>
                <select id="m_spin" onchange="updateMotor()">
                    <option value="CW">Clockwise (CW)</option>
                    <option value="CCW">Counter-Clockwise (CCW)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Cant Angles (Roll, Pitch) degrees</label>
                <div class="row">
                    <input type="number" id="m_cant_r" value="0" step="1" onchange="updateMotor()">
                    <input type="number" id="m_cant_p" value="0" step="1" onchange="updateMotor()">
                </div>
            </div>

            <button onclick="applyToAllMotors()" style="margin-top: 10px; background: rgba(59, 130, 246, 0.2); border: 1px solid var(--accent); color: var(--accent);">Apply Specs to All</button>
            <button class="danger" onclick="deleteMotor()" style="margin-top: 10px;">Delete Motor</button>
        </div>

        <div id="empty-selection" class="empty-state" style="margin-top: 20px;">
            Select a motor on the canvas or from the list below to edit it.
        </div>

        <h2>Motor List</h2>
        <div class="motor-list" id="motor-list"></div>
    </div>

    <script>
        const canvas = document.getElementById('designer');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        function resizeCanvas() {
            canvas.width = container.clientWidth - 40;
            canvas.height = container.clientHeight - 40;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        let pixelsPerMeter = 2000;
        
        let motors = [
            { id: 1, x: 80, y: 80, prop: 5, force: 12, perf_data: "", thrust_unit: "gf", torque_unit: "Nm", drag: 0.015, prop_mass: 3.0, spin: 'CCW', cant_r: 0, cant_p: 0 },
            { id: 2, x: 80, y: -80, prop: 5, force: 12, perf_data: "", thrust_unit: "gf", torque_unit: "Nm", drag: 0.015, prop_mass: 3.0, spin: 'CW', cant_r: 0, cant_p: 0 },
            { id: 3, x: -80, y: 80, prop: 5, force: 12, perf_data: "", thrust_unit: "gf", torque_unit: "Nm", drag: 0.015, prop_mass: 3.0, spin: 'CW', cant_r: 0, cant_p: 0 },
            { id: 4, x: -80, y: -80, prop: 5, force: 12, perf_data: "", thrust_unit: "gf", torque_unit: "Nm", drag: 0.015, prop_mass: 3.0, spin: 'CCW', cant_r: 0, cant_p: 0 }
        ];
        
        let selectedMotorId = null;
        let isDragging = false;
        let nextId = 5;

        // Draw loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Draw grid
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += pixelsPerMeter * 0.05) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Draw axes
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
            
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '12px Inter';
            ctx.fillText('+X (Forward)', cx + 10, 20);
            ctx.fillText('+Y (Left)', 10, cy - 10);

            // Draw Core
            const cx_size = (parseFloat(document.getElementById('g_size_x').value) / 1000) * pixelsPerMeter;
            const cy_size = (parseFloat(document.getElementById('g_size_y').value) / 1000) * pixelsPerMeter;
            ctx.fillStyle = 'rgba(59, 130, 246, 0.4)';
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            // Note: MuJoCo +X is UP on this 2D canvas, +Y is LEFT.
            // Let's map X to -Y (up) and Y to -X (left)
            ctx.fillRect(cx - cy_size, cy - cx_size, cy_size*2, cx_size*2);
            ctx.strokeRect(cx - cy_size, cy - cx_size, cy_size*2, cx_size*2);

            // Draw Center of Mass override if not 0
            const comX = parseFloat(document.getElementById('g_com_x').value) / 1000;
            const comY = parseFloat(document.getElementById('g_com_y').value) / 1000;
            if (comX !== 0 || comY !== 0) {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(cx - comY * pixelsPerMeter, cy - comX * pixelsPerMeter, 5, 0, Math.PI*2);
                ctx.fill();
            }

            // Draw Motors
            motors.forEach(m => {
                const drawX = cx - (m.y / 1000) * pixelsPerMeter;
                const drawY = cy - (m.x / 1000) * pixelsPerMeter;
                
                // Draw Arm
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(drawX, drawY);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Draw Propeller disc
                const propRadius = (m.prop * 0.0254 / 2) * pixelsPerMeter;
                ctx.beginPath();
                ctx.arc(drawX, drawY, propRadius, 0, Math.PI * 2);
                
                if (m.id === selectedMotorId) {
                    ctx.fillStyle = m.spin === 'CW' ? 'rgba(239, 68, 68, 0.6)' : 'rgba(34, 197, 94, 0.6)';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                } else {
                    ctx.fillStyle = m.spin === 'CW' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(34, 197, 94, 0.3)';
                    ctx.strokeStyle = m.spin === 'CW' ? '#ef4444' : '#22c55e';
                    ctx.lineWidth = 1;
                }
                ctx.fill();
                ctx.stroke();
                
                // Draw cant indicators
                if (m.cant_r !== 0 || m.cant_p !== 0) {
                    ctx.beginPath();
                    ctx.moveTo(drawX, drawY);
                    // Visualize cant vector
                    ctx.lineTo(drawX + m.cant_r * 2, drawY - m.cant_p * 2);
                    ctx.strokeStyle = '#eab308';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText(`M${m.id}`, drawX, drawY + 4);
            });
            
            updateMotorList();
        }

        // Interaction Logic
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const px = evt.clientX - rect.left;
            const py = evt.clientY - rect.top;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Unmap: drawX = cx - (y/1000)*PPM => y = (cx - drawX)/PPM * 1000
            // drawY = cy - (x/1000)*PPM => x = (cy - drawY)/PPM * 1000
            return {
                x: ((cy - py) / pixelsPerMeter) * 1000,
                y: ((cx - px) / pixelsPerMeter) * 1000
            };
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            if (e.deltaY < 0) {
                pixelsPerMeter *= zoomFactor;
            } else {
                pixelsPerMeter /= zoomFactor;
            }
            draw();
        });

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            // Find clicked motor
            let clicked = null;
            for(let m of motors) {
                const propR = (m.prop * 0.0254 / 2) * 1000; // in mm
                const dist = Math.hypot(m.x - pos.x, m.y - pos.y);
                if (dist <= propR) {
                    clicked = m;
                    break;
                }
            }
            
            if (clicked) {
                selectMotor(clicked.id);
                isDragging = true;
            } else {
                selectMotor(null);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && selectedMotorId) {
                const pos = getMousePos(e);
                const m = motors.find(x => x.id === selectedMotorId);
                m.x = Math.round(pos.x);
                m.y = Math.round(pos.y);
                populateMotorForm();
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });

        // UI Logic
        function addMotor() {
            motors.push({
                id: nextId++,
                x: 100, y: 100, z: 0, prop: 5, force: 12, perf_data: "", thrust_unit: "gf", torque_unit: "Nm", drag: 0.015, prop_mass: 3.0, spin: 'CW', cant_r: 0, cant_p: 0
            });
            selectMotor(nextId - 1);
        }

        function deleteMotor() {
            if (!selectedMotorId) return;
            motors = motors.filter(m => m.id !== selectedMotorId);
            selectMotor(null);
        }

        function selectMotor(id) {
            selectedMotorId = id;
            if (id) {
                document.getElementById('motor-settings').style.display = 'block';
                document.getElementById('empty-selection').style.display = 'none';
                populateMotorForm();
            } else {
                document.getElementById('motor-settings').style.display = 'none';
                document.getElementById('empty-selection').style.display = 'block';
            }
            draw();
        }

        function populateMotorForm() {
            const m = motors.find(x => x.id === selectedMotorId);
            if (!m) return;
            document.getElementById('m_x').value = m.x;
            document.getElementById('m_y').value = m.y;
            document.getElementById('m_z').value = m.z !== undefined ? m.z : 0;
            document.getElementById('m_prop').value = m.prop;
            document.getElementById('m_force').value = m.force;
            document.getElementById('m_perf_data').value = m.perf_data || "";
            document.getElementById('m_thrust_unit').value = m.thrust_unit || "gf";
            document.getElementById('m_torque_unit').value = m.torque_unit || "Nm";
            document.getElementById('m_drag').value = m.drag;
            document.getElementById('m_prop_mass').value = m.prop_mass || 3.0;
            document.getElementById('m_spin').value = m.spin;
            document.getElementById('m_cant_r').value = m.cant_r;
            document.getElementById('m_cant_p').value = m.cant_p;
        }

        function updateMotor() {
            const m = motors.find(x => x.id === selectedMotorId);
            if (!m) return;
            m.x = parseFloat(document.getElementById('m_x').value);
            m.y = parseFloat(document.getElementById('m_y').value);
            m.z = parseFloat(document.getElementById('m_z').value) || 0;
            m.prop = parseFloat(document.getElementById('m_prop').value);
            m.force = parseFloat(document.getElementById('m_force').value);
            m.perf_data = document.getElementById('m_perf_data').value;
            m.thrust_unit = document.getElementById('m_thrust_unit').value;
            m.torque_unit = document.getElementById('m_torque_unit').value;
            m.drag = parseFloat(document.getElementById('m_drag').value);
            m.prop_mass = parseFloat(document.getElementById('m_prop_mass').value);
            m.spin = document.getElementById('m_spin').value;
            m.cant_r = parseFloat(document.getElementById('m_cant_r').value);
            m.cant_p = parseFloat(document.getElementById('m_cant_p').value);
            draw();
        }

        function autoCalcFromData() {
            const m = motors.find(x => x.id === selectedMotorId);
            if (!m || !m.perf_data) return;
            
            const lines = m.perf_data.trim().split('\n');
            let maxThrustN = 0;
            let dragRatios = [];
            
            for(let line of lines) {
                const parts = line.trim().split(/[\s,]+/).map(parseFloat);
                if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                    let thrust = parts[1];
                    if (m.thrust_unit === 'gf') thrust *= 0.00980665;
                    if (m.thrust_unit === 'kgf') thrust *= 9.80665;
                    
                    if (thrust > maxThrustN) maxThrustN = thrust;
                    
                    if (parts.length >= 3 && !isNaN(parts[2])) {
                        let torque = parts[2];
                        if (m.torque_unit === 'Ncm') torque *= 0.01;
                        let ratio = torque / thrust;
                        // Sanity check: Propellers usually have a torque-to-thrust ratio around 0.01 to 0.02.
                        // If it's > 0.1, the user probably pasted Current (Amps) instead of Torque (Nm).
                        if (thrust > 0 && ratio < 0.1) {
                            dragRatios.push(ratio);
                        }
                    }
                }
            }
            
            if (maxThrustN > 0) {
                m.force = parseFloat(maxThrustN.toFixed(2));
                document.getElementById('m_force').value = m.force;
            }
            if (dragRatios.length > 0) {
                const avgDrag = dragRatios.reduce((a, b) => a + b, 0) / dragRatios.length;
                m.drag = parseFloat(avgDrag.toFixed(5));
                document.getElementById('m_drag').value = m.drag;
            }
            updateMotor();
        }

        function applyToAllMotors() {
            const m = motors.find(x => x.id === selectedMotorId);
            if (!m) return;
            
            motors.forEach(other => {
                if (other.id !== m.id) {
                    other.prop = m.prop;
                    other.z = m.z !== undefined ? m.z : 0;
                    other.force = m.force;
                    other.perf_data = m.perf_data;
                    other.thrust_unit = m.thrust_unit;
                    other.torque_unit = m.torque_unit;
                    other.drag = m.drag;
                    other.prop_mass = m.prop_mass;
                    other.cant_r = m.cant_r;
                    other.cant_p = m.cant_p;
                }
            });
            draw();
            updateMotorList();
        }

        function updateMotorList() {
            const list = document.getElementById('motor-list');
            list.innerHTML = '';
            motors.forEach(m => {
                const div = document.createElement('div');
                div.className = `motor-item ${m.id === selectedMotorId ? 'selected' : ''}`;
                div.innerHTML = `<span>Motor ${m.id} (${m.prop}")</span> <span>${m.spin}</span>`;
                div.onclick = () => selectMotor(m.id);
                list.appendChild(div);
            });
        }

        // Export SDF
        function exportSDF() {
            const name = document.getElementById('g_name').value || 'custom_drone';
            const mass = document.getElementById('g_mass').value;
            const sx = parseFloat(document.getElementById('g_size_x').value) / 1000;
            const sy = parseFloat(document.getElementById('g_size_y').value) / 1000;
            const sz = parseFloat(document.getElementById('g_size_z').value) / 1000;
            
            const cx = parseFloat(document.getElementById('g_com_x').value) / 1000;
            const cy = parseFloat(document.getElementById('g_com_y').value) / 1000;
            const cz = parseFloat(document.getElementById('g_com_z').value) / 1000;
            const dof = document.getElementById('g_dof').value;
            const delay = document.getElementById('g_delay').value;
            const tau = document.getElementById('g_tau').value;
            const simTime = document.getElementById('g_sim_time').value;

            let inertial_tag = "";
            if (cx !== 0 || cy !== 0 || cz !== 0) {
                // If override is provided, we use it. We'll give it a generic diaginertia.
                inertial_tag = `<inertial pos="${cx} ${cy} ${cz}" mass="${mass}" diaginertia="0.003 0.003 0.005"/>`;
            }

            let mjcf = `<mujoco model="${name}">
    <compiler angle="degree" coordinate="local" eulerseq="xyz"/>
    <option timestep="0.002" gravity="0 0 -9.81"/>
    
    <custom>
        <numeric name="transport_delay_ms" data="${delay}"/>
        <numeric name="motor_tau" data="${tau}"/>
        <numeric name="sim_duration_s" data="${simTime}"/>
        <numeric name="dof_mask" data="${dof}"/>
    </custom>
    
    <worldbody>
        <light name="sun" pos="0 0 10" dir="0 0 -1"/>
        <geom name="floor" type="plane" size="10 10 0.1" rgba="0.8 0.9 0.8 1"/>
        
        <body name="drone" pos="0 0 1">
            <freejoint name="root"/>
            ${inertial_tag}
            <!-- Core -->
            <geom name="core" type="box" size="${sx} ${sy} ${sz}" ${inertial_tag ? '' : `mass="${mass}"`} rgba="0.2 0.3 0.8 1"/>
`;

            let actuators = `    <actuator>\n`;
            
            let sdf = `<sdf version="1.7">\n  <model name="${name}">\n`;
            
            // Calculate accurate box inertia for Gazebo base_link
            const ixx_core = (1/3) * mass * (sy*sy + sz*sz);
            const iyy_core = (1/3) * mass * (sx*sx + sz*sz);
            const izz_core = (1/3) * mass * (sx*sx + sy*sy);

            // Build SDF base link
            sdf += `    <link name="base_link">
      <inertial>
        <pose>${cx} ${cy} ${cz} 0 0 0</pose>
        <mass>${mass}</mass>
        <inertia><ixx>${ixx_core}</ixx><iyy>${iyy_core}</iyy><izz>${izz_core}</izz><ixy>0</ixy><ixz>0</ixz><iyz>0</iyz></inertia>
      </inertial>
      <visual name="core_vis">
        <geometry><box><size>${sx*2} ${sy*2} ${sz*2}</size></box></geometry>
        <material><ambient>0.2 0.3 0.8 1</ambient></material>
      </visual>
      <collision name="core_col">
        <geometry><box><size>${sx*2} ${sy*2} ${sz*2}</size></box></geometry>
      </collision>\n`;

            if (document.getElementById('g_sensor_imu').checked) {
                sdf += `      <sensor name="imu_sensor" type="imu">
        <gz_frame_id>base_link</gz_frame_id>
        <always_on>1</always_on>
        <update_rate>250</update_rate>
        <imu>
          <angular_velocity>
            <x><noise type="gaussian"><mean>0</mean><stddev>0.000186</stddev></noise></x>
            <y><noise type="gaussian"><mean>0</mean><stddev>0.000186</stddev></noise></y>
            <z><noise type="gaussian"><mean>0</mean><stddev>0.000186</stddev></noise></z>
          </angular_velocity>
          <linear_acceleration>
            <x><noise type="gaussian"><mean>0</mean><stddev>0.00186</stddev></noise></x>
            <y><noise type="gaussian"><mean>0</mean><stddev>0.00186</stddev></noise></y>
            <z><noise type="gaussian"><mean>0</mean><stddev>0.00186</stddev></noise></z>
          </linear_acceleration>
        </imu>
      </sensor>\n`;
            }
            if (document.getElementById('g_sensor_baro').checked) {
                sdf += `      <sensor name="air_pressure_sensor" type="air_pressure">
        <gz_frame_id>base_link</gz_frame_id>
        <always_on>1</always_on>
        <update_rate>50</update_rate>
        <air_pressure>
          <reference_altitude>0</reference_altitude>
          <pressure>
            <noise type="gaussian">
              <mean>0</mean>
              <stddev>0.01</stddev>
            </noise>
          </pressure>
        </air_pressure>
      </sensor>\n`;
            }
            if (document.getElementById('g_sensor_mag').checked) {
                sdf += `      <sensor name="magnetometer_sensor" type="magnetometer">
        <gz_frame_id>base_link</gz_frame_id>
        <always_on>1</always_on>
        <update_rate>100</update_rate>
        <magnetometer>
          <x>
            <noise type="gaussian"><mean>0</mean><stddev>1e-5</stddev></noise>
          </x>
          <y>
            <noise type="gaussian"><mean>0</mean><stddev>1e-5</stddev></noise>
          </y>
          <z>
            <noise type="gaussian"><mean>0</mean><stddev>1e-5</stddev></noise>
          </z>
        </magnetometer>
      </sensor>\n`;
            }
            if (document.getElementById('g_sensor_gps').checked) {
                sdf += `      <sensor name="navsat_sensor" type="navsat">
        <gz_frame_id>base_link</gz_frame_id>
        <always_on>1</always_on>
        <update_rate>10</update_rate>
      </sensor>\n`;
            }

            sdf += `    </link>\n`;

            motors.forEach((m, i) => {
                const propRadius = (m.prop * 0.0254) / 2.0;
                const m_x_m = m.x / 1000;
                const m_y_m = m.y / 1000;
                const m_z_m = (m.z !== undefined ? m.z : 0) / 1000;
                
                const arm_mass = 0.02 * (Math.hypot(m_x_m, m_y_m) / 0.1);
                const yaw_torque = m.spin === 'CW' ? -m.drag : m.drag;
                const p_mass = (m.prop_mass || 3.0) / 1000;
                const perf_data_attr = m.perf_data ? m.perf_data.replace(/\n/g, '; ') : "";
                
                // Add to MJCF
                mjcf += `
            <!-- Motor ${i}: ${m.prop}" ${m.spin} (Force: ${m.force}N, Cant: ${m.cant_r}, ${m.cant_p}) [Data: ${perf_data_attr || "none"} Unit: ${m.thrust_unit}] -->
            <body name="motor_assembly_${i}" pos="0 0 0">
                <geom name="arm_${i}" type="capsule" fromto="0 0 0 ${m_x_m} ${m_y_m} ${m_z_m}" size="0.005" mass="${arm_mass.toFixed(3)}" rgba="0.5 0.5 0.5 1"/>
                <body name="motor_mount_${i}" pos="${m_x_m} ${m_y_m} ${m_z_m + 0.005}" euler="${m.cant_r} ${m.cant_p} 0">
                    <geom name="motor_bell_${i}" type="cylinder" size="0.015 0.005" mass="0.03" rgba="0.2 0.2 0.2 1"/>
                    <geom name="prop_${i}" type="cylinder" pos="0 0 0.005" size="${propRadius.toFixed(3)} 0.002" mass="${p_mass.toFixed(4)}" rgba="0.1 0.1 0.1 0.3"/>
                    <site name="thruster_${i}" type="cylinder" pos="0 0 0.005" size="${propRadius.toFixed(3)} 0.002" rgba="${m.y > 0 ? "1 0 0 0.5" : "0 0 1 0.5"}"/>
                </body>
            </body>\n`;

                actuators += `        <general name="m_${i}" site="thruster_${i}" gear="0 0 1 0 0 ${yaw_torque.toFixed(4)}" ctrllimited="true" ctrlrange="0 ${m.force.toFixed(1)}"/>\n`;
                
                // Calculate a safe, physically valid inertia for Gazebo
                const link_mass = arm_mass + 0.03 + p_mass;
                const i_zz = link_mass * propRadius * propRadius * 0.5;
                const i_val = Math.max(i_zz, 0.0001); // Ensure it's not zero
                
                // Add to SDF
                sdf += `    <link name="motor_${i}">
      <pose>${m_x_m} ${m_y_m} ${0.01 + m_z_m} ${m.cant_r} ${m.cant_p} 0</pose>
      <inertial>
        <mass>${link_mass}</mass>
        <inertia><ixx>${i_val}</ixx><iyy>${i_val}</iyy><izz>${i_val}</izz><ixy>0</ixy><ixz>0</ixz><iyz>0</iyz></inertia>
      </inertial>
      <visual name="prop_${i}_vis">
        <pose>0 0 0.005 0 0 0</pose>
        <geometry><cylinder><radius>${propRadius.toFixed(3)}</radius><length>0.002</length></cylinder></geometry>
        <material><ambient>0.1 0.1 0.1 0.8</ambient></material>
      </visual>
    </link>
    <joint name="j_m_${i}" type="revolute">
      <parent>base_link</parent>
      <child>motor_${i}</child>
      <axis>
        <xyz>0 0 1</xyz>
        <limit>
          <lower>-1e+16</lower>
          <upper>1e+16</upper>
        </limit>
      </axis>
    </joint>
    <plugin filename="gz-sim-multicopter-motor-model-system"
      name="gz::sim::systems::MulticopterMotorModel">
      <jointName>j_m_${i}</jointName>
      <linkName>motor_${i}</linkName>
      <turningDirection>${m.spin.toLowerCase()}</turningDirection>
      <timeConstantUp>0.0125</timeConstantUp>
      <timeConstantDown>0.025</timeConstantDown>
      <maxRotVelocity>1000</maxRotVelocity>
      <motorConstant>8.54858e-06</motorConstant>
      <momentConstant>0.06</momentConstant>
      <commandSubTopic>command/motor_speed</commandSubTopic>
      <motorNumber>${i}</motorNumber>
      <rotorDragCoefficient>0.000806428</rotorDragCoefficient>
      <rollingMomentCoefficient>1e-06</rollingMomentCoefficient>
      <rotorVelocitySlowdownSim>10</rotorVelocitySlowdownSim>
      <motorType>velocity</motorType>
    </plugin>\n`;
            });

            mjcf += `        </body>\n    </worldbody>\n\n${actuators}    </actuator>\n</mujoco>`;

            sdf += `    <mujoco_xml>\n${mjcf}\n    </mujoco_xml>\n  </model>\n</sdf>`;

            // Download
            const blob = new Blob([sdf], {type: "text/xml"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${name}.sdf`;
            a.click();
        }

        // Add event listeners to global inputs to trigger draw
        ['g_size_x', 'g_size_y', 'g_com_x', 'g_com_y'].forEach(id => {
            document.getElementById(id).addEventListener('change', draw);
        });

        // Initial draw
        resizeCanvas();
    </script>
</body>
</html>
